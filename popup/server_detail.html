<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #fff; --fg: #1a202c; --muted: #718096; --border: #e2e8f0;
      --code-bg: #f7fafc; --link: #2b6cb0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1b1e; --fg: #e2e8f0; --muted: #a0aec0; --border: #2d3748;
        --code-bg: #232428; --link: #63b3ed;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px; width: 480px;
      font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h2 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .bar { display: flex; justify-content: space-between; align-items: end; }
    button {
      font: inherit; font-size: 12px; padding: 2px 10px; cursor: pointer;
      color: var(--fg); background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
    }
    pre {
      margin: 0; padding: 8px; max-height: 260px; overflow: auto;
      font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
    }
    ul { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; }
    details { margin-top: 12px; }
    summary { cursor: pointer; color: var(--muted); }
    #qrcode { margin-top: 8px; padding: 8px; background: #fff; width: max-content; }
    .notice { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="notice" class="notice" hidden></p>
  <button id="grant" hidden>Grant access to all sites</button>

  <main id="details" hidden>
    <dl>
      <dt>URL</dt><dd id="url"></dd>
      <dt>IP</dt><dd><a id="ip" target="_blank" rel="noopener noreferrer" title="Open this IP"></a></dd>
      <dt>Server</dt><dd><a id="server" target="_blank" rel="noopener noreferrer" title="Search on DuckDuckGo"></a></dd>
    </dl>

    <div class="bar">
      <h2>Response headers</h2>
      <button id="copy">Copy</button>
    </div>
    <pre id="headers"></pre>

    <section id="lookups">
      <h2>IP lookup</h2>
      <dl id="lookup-groups"></dl>
    </section>

    <details id="qr">
      <summary>QR code</summary>
      <div id="qrcode"></div>
    </details>
  </main>

  <script src="qrcode.js"></script>
  <script src="server_detail.js"></script>
</body>
</html>
